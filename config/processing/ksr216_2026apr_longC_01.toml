# Section layout follows DS_EB1A_2023jul_longO_01.toml.
# Parameter values are specific to this scan set and have been preserved.

[darks]
upper_percentile = 99.98

[plotting]
# Review energies appropriate to this scan's measured energy range.
energies_ev = [284.8, 286.0]

[beamstop]
center_x = 743
center_y = 189
length = 900
width = 54
angle_degrees = -50

[detector_borders]
left_pixels = 3
right_pixels = 3
bottom_pixels = 6
top_pixels = 6

[center_mask]
saturation_search_width = 90
outer_usable_radius = 459

[beam_centers.ksr216_2026apr_longC_01_pair_0_90]
center_x = 472.85
center_y = 514.8

[beam_centers.ksr216_2026apr_longC_01_pair_45_135]
center_x = 472.85
center_y = 514.7

[beam_center_fit]
coarse_search_radius = 4
coarse_step = 1
fine_search_radius = 0.8
fine_step = 0.1
# Inspect the fringe at fit_energy before relying on the center fit.
fit_energy = 284.8
q_target = 0.02201
q_window_halfwidth = 0.003
chi_half_width_degrees = 45
postmask_threshold = 1.0
reflection_mode = "fourfold"
apply_postmask = true

[runtime]
beam_center_jobs = 32

[integration]
postmask_threshold = 1.0

[normalization]
half_ring_center_degrees = 180
half_ring_halfwidth_degrees = 90

[flux_correction]
enabled = true

[angular_anisotropy_fit]
energy_ev = 284.8
q_value = 0.04
q_bins = 7
period_degrees = 90
harmonics = 1
comparison_max_cycles = 8
comparison_max_harmonics = 2

# Standard sector halfwidth for pointwise and sector anisotropy.
# This is independent of beam-center-fit and normalization halfwidths.
[anisotropy]
chi_halfwidth_degrees = 45
