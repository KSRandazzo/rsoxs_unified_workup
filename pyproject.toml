[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rsoxs-unified-workup"
version = "0.1.0"
description = "Reusable and reproducible RSoXS scan workup"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "joblib",
    "matplotlib",
    "numpy",
    "pandas>=2.3,<3",
    "PyHyperScattering==0.2.10",
    "scikit-image",
    "scipy",
    "tiled",
    "tqdm",
    "xarray>=2025.7",
    "zarr>=2.18,<3",
]
[tool.setuptools.packages.find]
where = ["src"]
